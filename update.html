<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Actualizar Bondi</title></head>
<body>
<p>Actualizando la app...</p>
<script>
(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('bondi-')).map(k=>caches.delete(k)));}}catch(e){}location.replace('/?v=191&u='+Date.now());})();
</script>
</body></html>
